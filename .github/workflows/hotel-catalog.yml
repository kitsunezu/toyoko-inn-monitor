name: Hotel Catalog Check

on:
  pull_request:
    paths:
      - 'lib/data/locations.dart'
      - 'tool/sync_hotels.dart'
      - 'test/hotel_catalog_test.dart'
      - '.github/workflows/hotel-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

concurrency:
  group: hotel-catalog-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Sync official hotel catalog
        if: github.event_name != 'pull_request'
        run: dart run tool/sync_hotels.dart --audit-json tool/hotel_catalog_audit.json

      - name: Format generated catalog
        if: github.event_name != 'pull_request'
        run: dart format lib/data/locations.dart

      - name: Check official hotel catalog
        if: github.event_name == 'pull_request'
        run: dart run tool/sync_hotels.dart --check --audit-json tool/hotel_catalog_audit.json

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Commit catalog updates
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git add lib/data/locations.dart assets/hotel_catalog.json
          if (git diff --cached --quiet) {
            Write-Host "Hotel catalog is already up to date."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update hotel catalog"
          git push origin HEAD:main
